<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Open Musamimuk</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: #252a30;
      color: #f5f5f5;
      text-align: center;
      padding: 24px;
    }
    a.btn {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 20px;
      border-radius: 10px;
      background: #f5c518;
      color: #1a1a1a;
      font-weight: 700;
      text-decoration: none;
    }
    p { opacity: 0.85; max-width: 28rem; }
  </style>
</head>
<body>
  <main>
    <h1>Opening Musamimuk…</h1>
    <p>
      If the app is installed it should open automatically.
      If nothing happens, install Musamimuk from Google Play.
    </p>
    <a class="btn" id="store" href="https://play.google.com/store/apps/details?id=com.musamimuk.app">
      Get it on Google Play
    </a>
  </main>
  <script>
    (function () {
      var PLAY =
        'https://play.google.com/store/apps/details?id=com.musamimuk.app';
      var path = window.location.pathname + window.location.search + window.location.hash;
      // Prefer custom scheme so installed apps open even before App Link verification.
      var custom = 'musamimuk://' + path.replace(/^\//, '');
      var intent =
        'intent://' +
        window.location.host +
        path +
        '#Intent;scheme=https;package=com.musamimuk.app;S.browser_fallback_url=' +
        encodeURIComponent(PLAY) +
        ';end';

      // Try custom scheme first, then Android intent URL, then Play Store.
      window.location.href = custom;
      setTimeout(function () {
        window.location.href = intent;
      }, 400);
      setTimeout(function () {
        window.location.href = PLAY;
      }, 1400);
    })();
  </script>
</body>
</html>
