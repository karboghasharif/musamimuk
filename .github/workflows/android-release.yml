name: Android Release

# Signed AAB → Google Play production (default).
# Trigger: git tag v*  OR  Actions → Android Release → Run workflow
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      track:
        description: Play track
        required: true
        default: production
        type: choice
        options:
          - production
          - beta
          - alpha
          - internal

jobs:
  build-and-upload:
    name: Build AAB & upload to Play
    runs-on: ubuntu-latest
    # Cold Gradle + NDK download regularly exceeds 60m on first release builds.
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        # Prefetch so bundleRelease does not stall mid-build on first NDK fetch.
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;28.2.13676358"

      - name: Pub get
        run: flutter pub get

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Write key.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "Missing one of ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_PASSWORD / ANDROID_KEY_ALIAS"
            exit 1
          fi
          printf '%s\n' \
            "storePassword=${ANDROID_KEYSTORE_PASSWORD}" \
            "keyPassword=${ANDROID_KEY_PASSWORD}" \
            "keyAlias=${ANDROID_KEY_ALIAS}" \
            "storeFile=upload-keystore.jks" \
            > android/key.properties

      - name: Patch file_picker AGP9 Kotlin skip
        # file_picker 11 skips kotlin-android when AGP≥9; with Flutter's builtInKotlin=false that
        # leaves FilePickerPlugin uncompiled. Force-apply kotlin-android regardless of AGP.
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, pathlib, re, urllib.parse
          cfg = json.loads(pathlib.Path(".dart_tool/package_config.json").read_text())
          pkg = next(p for p in cfg["packages"] if p["name"] == "file_picker")
          root = pkg["rootUri"]
          if root.startswith("file:"):
              root_path = pathlib.Path(urllib.parse.unquote(urllib.parse.urlparse(root).path))
          else:
              root_path = (pathlib.Path(".dart_tool") / root).resolve()
          path = root_path / "android" / "build.gradle"
          if not path.is_file():
              raise SystemExit(f"file_picker android/build.gradle not found: {path}")
          text = path.read_text()
          text2 = re.sub(
              r"if\s*\(\s*!isAgp9OrAbove\s*\)\s*\{\s*apply plugin:\s*'org\.jetbrains\.kotlin\.android'\s*\}",
              "apply plugin: 'org.jetbrains.kotlin.android'",
              text,
              count=1,
              flags=re.S,
          )
          if text2 == text and "apply plugin: 'org.jetbrains.kotlin.android'" not in text:
              text2 = text.replace(
                  "apply plugin: 'com.android.library'",
                  "apply plugin: 'com.android.library'\napply plugin: 'org.jetbrains.kotlin.android'",
                  1,
              )
          # Keep kotlinOptions even on AGP 9 once kotlin-android is forced on.
          text2 = re.sub(
              r"if\s*\(\s*!isAgp9OrAbove\s*\)\s*\{\s*kotlinOptions\s*\{",
              "kotlinOptions {",
              text2,
              count=1,
              flags=re.S,
          )
          # Drop the matching closing brace that belonged to the removed if ().
          text2 = re.sub(
              r"(kotlinOptions\s*\{[^}]*\})\s*\}",
              r"\1",
              text2,
              count=1,
              flags=re.S,
          )
          path.write_text(text2)
          print(f"patched {path}")
          PY

      - name: Build App Bundle
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx6g
        run: |
          set -o pipefail
          flutter build appbundle --release --no-pub 2>&1 | tee aab-build.log

      - name: Annotate AAB failure
        if: failure()
        run: |
          python3 <<'PY'
          from pathlib import Path
          log = Path("aab-build.log").read_text(errors="replace")
          keys = ("cannot find symbol", "What went wrong", "FAILURE:", "error:", "Execution failed", "A problem occurred")
          lines = log.splitlines()
          hits = []
          for i, line in enumerate(lines):
              if any(k in line for k in keys):
                  start = max(0, i - 2)
                  end = min(len(lines), i + 8)
                  hits.append("\n".join(lines[start:end]))
          blob = "\n---\n".join(hits[-6:]) if hits else log[-4000:]
          # Keep annotation readable for the Actions UI / public API.
          blob = blob[-3500:].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print(f"::error title=AAB build failed::{blob}")
          PY

      - name: Upload AAB build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aab-build-log
          path: aab-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: musamimuk-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.musamimuk.app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'production' }}
          status: completed
